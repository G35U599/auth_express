<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Recuperación de contraseña</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f6f7fb; padding: 24px;">
    <div style="max-width: 520px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 10px;">
      <h2 style="margin: 0 0 12px;">Recuperacion de contrasena</h2>
      <p>Hola,</p>
      <p>Tu codigo de recuperacion es:</p>
      <div style="font-size: 24px; letter-spacing: 4px; font-weight: bold; margin: 16px 0;">
        {{code}}
      </div>
      <p>Este codigo expira en {{ttlMinutes}} minutos.</p>
      <p style="color:#666; font-size: 12px;">
        Si no solicitaste este codigo, ignora este correo.
      </p>
    </div>
  </body>
</html>
